# MESA_ARGUS machine configuration.
#
# On a new machine you normally only need `colors_data` (if your MESA colors
# data is not at $MESA_DIR/data/colors_data) and maybe the [run] numbers.
# Relative paths in [colors] are relative to `colors_data`.

[paths]
mesa_dir = ""                 # empty -> $MESA_DIR
colors_data = ""              # empty -> <mesa_dir>/data/colors_data

[colors]
stellar_atm   = "stellar_models/Kurucz2003all/"
vega_sed      = "stellar_models/vega_flam.csv"
gaia_filters  = "filters/GAIA/GAIA"          # needs G.dat, Gbp.dat, Grp.dat
argus_filters = "filters/Argus/System"       # needs beta.dat, rho.dat (system throughput)

[run]
workers = 9                   # stars modelled at once (each starts several MESA runs: convection sets, kicks)
omp_threads = 1               # OpenMP threads per evolution-track run (python -m mesa_argus run)
rsp_threads = 0               # OpenMP threads per RSP run (argus_field.py / rsp.py); 0 = auto (1-4, from idle cores)
max_star_procs = 9            # cores MESA may use (0 = all). Evolution runs: cap on `star` processes machine-wide.
                              # RSP: total threads of all RSP runs at once <= max_star_procs
