<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Field Simulator</title>
<style>
  :root { --ink: #253746; --tick: #435766; --edge: #86939e; --panel: #f4f6f8; --accent: #2078b4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 13px "DejaVu Sans", Verdana, sans-serif; }
  #title { text-align: center; font-size: 17px; padding: 14px 8px 4px; color: #000; }
  #figure { display: grid; grid-template-columns: 54fr 46fr; grid-template-rows: 560px 400px; gap: 0 18px;
            max-width: 1600px; margin: 0 auto; padding: 0 12px; }
  canvas { display: block; }
  .cell { position: relative; min-width: 0; }
  .cell > canvas { width: 100%; height: 100%; }
  #images { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  #controls { max-width: 1600px; margin: 8px auto 24px; padding: 12px 16px; background: var(--panel);
              border-top: 1px solid #dde3e8; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 24px; }
  fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
  legend { font-weight: bold; padding: 0 0 6px; color: #000; }
  label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  input[type=range] { flex: 1; min-width: 0; }
  input[type=number] { width: 72px; }
  select, button, input { font: inherit; }
  button { padding: 3px 10px; border: 1px solid #b8c3cc; background: #fff; border-radius: 3px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .readout { font-variant-numeric: tabular-nums; color: var(--tick); }
  #selected { min-height: 70px; }
  #status { color: #a35d00; min-height: 1.2em; }
  .wide { grid-column: span 2; }
  @media (max-width: 900px) {
    #figure { grid-template-columns: 1fr; grid-template-rows: auto; }
    #controls { grid-template-columns: 1fr; }
    .wide { grid-column: auto; }
  }
</style>
</head>
<body>
<div id="title"></div>
<div id="figure">
  <div class="cell" id="cmd-cell"><canvas id="cmd"></canvas></div>
  <div class="cell" id="images">
    <div class="cell"><canvas id="exposure"></canvas></div>
    <div class="cell"><canvas id="difference"></canvas></div>
  </div>
  <div class="cell"><canvas id="lc"></canvas></div>
  <div class="cell"><canvas id="sed"></canvas></div>
</div>
<div id="controls">
  <fieldset>
    <legend>Night</legend>
    <label><button id="play">▶ Play</button><span class="readout" id="clock"></span></label>
    <label>Exposure <input type="range" id="exposure-slider" min="0" value="0"></label>
    <label>Speed <input type="range" id="speed" min="1" max="24" value="8"><span class="readout" id="speed-out"></span></label>
    <label>Band
      <select id="band"><option value="rho">ρ (rho)</option><option value="beta">β (beta)</option></select></label>
    <div class="readout" id="measuring"></div>
  </fieldset>
  <fieldset>
    <legend>Conditions</legend>
    <label>Zenith seeing <input type="range" id="seeing" min="0.50" max="1.90" step="0.01"><span class="readout" id="seeing-out"></span></label>
    <label>Moon sky × <input type="range" id="moon" min="0" max="20" step="0.5" value="1"><span class="readout" id="moon-out"></span></label>
    <div class="readout" id="conditions"></div>
  </fieldset>
  <fieldset>
    <legend>Stars</legend>
    <label><button id="mode-select" class="on">Select / drag</button><button id="mode-constant">Add constant</button>
      <button id="mode-variable">Add variable</button></label>
    <label>G <input type="number" id="new-g" value="16.0" step="0.1"> BP−RP <input type="number" id="new-colour" value="0.8" step="0.05"></label>
    <label>Model <select id="new-model"></select> mean ρ <input type="number" id="new-mag" value="15.0" step="0.1"></label>
    <label><button id="reset">Reset field</button></label>
  </fieldset>
  <fieldset>
    <legend>Selected star</legend>
    <div id="selected" class="readout">click a star in the exposure</div>
    <div id="status"></div>
  </fieldset>
</div>
<script id="colormaps" type="application/json">/*COLORMAPS*/</script>
<script id="field-data" type="application/json">/*DATA*/</script>
<script id="sim-src">/*SIM*/</script>
<script id="sep-src">/*SEP*/</script>
<script id="measure-src">/*MEASURE*/</script>
<script>/*PLOT*/</script>
<script>/*APP*/</script>
</body>
</html>
