# A synthetic field with one bright GRB afterglow at the centre, bursting 1.5 h into the night of 2026-07-19.
#   python make_stars.py examples/stars/f294_field.toml examples/stars/transients.toml   # once (seconds)
#   python observe.py examples/observations/synthetic_grb.toml

[field]
ra = 294.7844
dec = -11.6235
block = 9

[night]
date = "2026-07-19"

[stars]
background = "f294_784m11_623_field"
layout = "random"

[[place]]
star = "grb_peak9"
t0 = "start+0.0625"

[output]
bands = ["rho"]
