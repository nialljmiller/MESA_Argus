# Every key of an observation file, with its default. Copy it, delete what you don't need (anything left out takes
# the default shown), and run:   python observe.py my_observation.toml
# Any key can be overridden on the command line:   python observe.py my_observation.toml --set output.stride=10
# The observation as made (every key, the night as used) is written to observation.toml in
# outputs/pseudo_real/<name>/ (layout real) or outputs/fully_synthetic/<name>/ (layout random).
# Stars are built first, by make_stars.py; an observation only names them.

[field]
ra = 294.7844             # deg, ICRS (required)
dec = -11.6235            # deg, ICRS (required)
block = 3                 # minipixes across the block shown: odd, 1-9 (3 = 84", 9 = 253")
name = ""                 # the output folder's name; default: this file's name

[night]
date = ""                 # local date the night starts, YYYY-MM-DD (default today; the nearest night the field is up
                          # if not); "auto": the night the placed real (Gaia) stars change most
start = ""                # UT HH:MM (default: dusk / when the field rises); "start+D" times count from here
end = ""                  # UT HH:MM (default: dawn / when the field sets)
site = "argus"            # "argus": ArgusSim's site; "sro": Sierra Remote Observatories
max_airmass = 0.0         # a further airmass limit; 0: none (the array's minimum altitude, 32.84 deg, always applies)
observing = "ideal"       # "ideal": every exposure in both bands, the season's median seeing, one PSF field angle;
                          # "survey": the exposures ArgusSim's array actually takes (mesa_argus/survey.py): one band
                          # each (the covering telescope's), gaps between telescopes, seeing per ratchet, the PSF at
                          # the field's angle in that telescope; no weather or clouds
nights = 1                # survey: nights from date
survey_seed = 0           # survey: the seeing draws (one seed, one realisation)

[stars]
background = "f294_784m11_623_field"   # a built star set (required): the field's constant stars
layout = "real"           # "real": the set's own positions; "random": scattered around the pointing (synthetic)
seed = 1                  # random layout; and any placed star with x or y = -1
missing = "stop"          # a placed star that is not built: "stop", or "skip" it

# Built stars put in the field, any number. Real Gaia stars (generator "Gaia variable") sit where they are, with
# their own ephemeris: give only star =. Others: x, y (percent of the image from its lower left; default 50, 50;
# -1 random) and t0 (transients) or epoch (periodic: a maximum / primary eclipse): ISO UTC "2026-07-20T05:30",
# "start+0.1" days from the night's (or the UT window's) start, or a BJD_TDB number. distance (pc, periodic stars):
# where the star is put, seen through the 3D map's dust at that distance on the field's sightline; default the
# model's own distance (a library star is stored at 10 pc and needs one).
[[place]]
star = "gaia_4186921728614505856"

[[place]]
star = "lib_rrab_p05521_mhm100"
distance = 8000
epoch = "start+0.1"
x = 60
y = 40

[[place]]
star = "sn_ia_z002"
t0 = "start+0.0625"
x = 30
y = 70

[pipeline]                # which implementation runs each measurement stage (mesa_argus/pipeline/)
extraction = "hdps"       # hdps's source detector (GPU, or its CPU mirror)
calibration = "atlas_refcat2"  # zero point against ATLAS-Refcat2 (hdps zeropoint; ~/.rico_cache/atlas_refcat2)
psf = "hdps_moffat"       # PSF: hdps's Moffat field fit to Refcat2 stars (as TilePSFTask), difference imaging's filter
reference = "sacrificial_night"  # reference: median of a night observed first (same stars, no transients)
dia = "hdps_zogy"         # difference imaging: hdps ZOGY, candidates from its calibrated S_corr
alerts = "hdps_v3"        # alert packets: hdps alert schema 3.0, JSON lines (alerts/)
lightcurves = "positional"  # detections linked by position across frames: catalogue.csv, lightcurves/
reference_date = ""       # the sacrificial night (YYYY-MM-DD; "": the night before the observation)

[measure]                 # the stages' settings (hdps production values for the detector)
detect_sigma = 3.0        # detection threshold (sigma)
bg_region_size = 64       # background region (pixels)
flux_radius = 4.0         # aperture radius (pixels)
matched_filter_width = 4.0  # matched filter FWHM (pixels)
de_dup_radius = 6.0       # detections closer than this (pixels) are merged, the brightest kept
cr_detect_contrast = 0.25 # cosmic-ray test: neighbours below this fraction of the peak
match_arcsec = 1.5        # calibration: match to Refcat2 (arcsec)
min_snr = 20.0            # calibration: a star counts only if measured at S/N >= this
refcat_radius_deg = 0.12  # calibration: Refcat2 cone (deg)
refcat_max_mag = 19.0     # calibration: faintest Refcat2 star read (g)
psf_mag_bright = 12.0     # psf: Refcat2 magnitude window of the PSF stars (hdps TilePSFTask: 12-17)
psf_mag_faint = 17.0
psf_select_stamp = 25     # psf: stamp (pixels) a PSF star must have clean and to itself
psf_max_stars = 200       # psf: at most this many PSF stars (the brightest)
psf_min_stars = 8         # psf: fewer and the frame is skipped (as hdps skips the tile; hdps: 12 per full tile)
psf_stamp = 41            # psf: the PSF image ZOGY takes (pixels)
dia_threshold = 8.0       # dia: candidate threshold (sigma; hdps 5, with a real/bogus classifier after it)
dia_region_size = 256     # dia: region (pixels) for S_corr's robust scale
dia_min_separation = 4    # dia: candidates at least this far apart (pixels)
astrometric_sigma = 0.032 # dia: ZOGY's astrometric noise (pixels; hdps's value)
dia_saturation_px = 10    # dia: no candidates this close (pixels) to a saturated pixel
dia_edge_px = 20          # dia: no candidates this close (pixels) to the edge (ZOGY's FFT wrap-around)
link_arcsec = 1.5         # lightcurves: a detection joins the nearest object within this (arcsec)
match_radius = 2.0        # truth: a detection or candidate is a simulated star within this (pixels); scoring only
[output]
movie = true              # render the movie (false: photometry and any FITS only)
bands = ["beta", "rho"]   # one movie and photometry CSV per band
fits = false              # every measured exposure, both bands, as FITS (fits/ in the output folder)
catalogues = true         # every measured exposure's detections and their simulated stars (catalogues/, parquet);
                          # with alerts, also each exposure's difference-image candidates (*_candidates.parquet)
alerts = true             # difference imaging and alert packets (alerts/); makes the reference first (reference/)
lightcurves = true        # with catalogues: catalogue.csv (one row per object) and lightcurves/ (one CSV per object)
page = false              # the interactive page (real Gaia stars only, for now)
stride = 1                # render and measure every Nth exposure
seed = 3                  # noise
exptime = 60.0            # s
# seeing = 1.0            # zenith FWHM (arcsec); default: ArgusSim's seasonal site median for the date
field_angle = 1.44        # deg from the optical axis (sets the PSF)
area = 8.0                # side (arcmin) of the simulated area
fps = 24.0
dpi = 100
kernel_half = 3           # difference-imaging kernel half-width (pixels)
kernel_clip = 3.0
kernel_stamps = 20.0
