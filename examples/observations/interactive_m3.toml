# Interactive field pack: M3, a globular cluster. One real night through hdps, both bands, nothing placed or injected; the
# movie data saved, every alert candidate kept with its features (the app re-scores them with any model).
[field]
name = "interactive_m3"
ra = 205.548
dec = 28.377
block = 9
window_offset = [0.0, -7.0]  # the readout window's centre 7' south of the core, the block still on it: centred on the
# core, hdps's linear WCS solver starts from a 0.1-3' circle of crowded detections and locks onto false alignments
# (pixel scale 5-15x wrong; 13 of 228 beta frames right, 2026-05-01 night); at 7' the circle holding its 150
# detections has radius ~6.8' (min 4.3'), as the frames that solved right (~5')

[night]
date = "2026-05-16"  # new moon (2026-05-01 was full, the Moon 46 deg from M3)
nights = 1

[stars]
background = "m3_field"
layout = "real"

[output]
movie = false
pipeline_movie = false

[[hdps.tasks]]
type = "DataCleanupTask"

[[hdps.tasks]]
type = "ImageReductionTask"

[[hdps.tasks]]
type = "SourceDetectionTask"

[[hdps.tasks]]
type = "SourceFilterTask"

[[hdps.tasks]]
type = "ReferenceRetrievalTask"

[[hdps.tasks]]
type = "LinearWCSSolverTask"

[[hdps.tasks]]
type = "SourceMatchingTask"

[[hdps.tasks]]
type = "TPVWCSSolverTask"

[[hdps.tasks]]
type = "LightweightFITSOutputTask"

[[hdps.tasks]]
type = "ReprojectionTask"

[[hdps.tasks]]
type = "CoaddTapTask"

[[hdps.tasks]]
type = "SFFTSubtractionTask"

[[hdps.tasks]]
type = "DiffDetectionTask"

[[hdps.tasks]]
type = "TransientOutputTask"

[[hdps.tasks]]
type = "AlertVettingTask"
[hdps.tasks.config]
emit_all_candidates = true

[[hdps.tasks]]
type = "TileImageOutputTask"
