# as the survey takes it for a week. Point lens, t_E 0.2 d, u0 0.02: the source (rho 19.1, below a single frame's
# limit) brightens 50 times (rho 14.8) at the peak and is back below the limit within hours. Peak 3 d 2 h after the
# first exposure: mid-way through the fourth night's observing (the survey takes f098 ~07:15-11:15 UT). The field's
# modelled Gaia variable at its real position.
